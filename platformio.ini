; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[platformio]
; Окружение по умолчанию для сборки в IDE (складской USB-режим).
default_envs = esp32_usb

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Полностью игнорируем COM1 во всех режимах
upload_port = !COM1
; === ИЗМЕНЕНО: библиотеки WiFi/WebServer/ESPmDNS/ArduinoOTA убраны, ===
; === т.к. веб-модуль не используется в складском режиме.             ===
; GyverHX711 — работа с HX711; Preferences — хранение калибровки в NVS.
lib_deps =
    Preferences
    GyverHX711

; --- Общие для всех окружений: НЕ компилируем веб-модуль ---------------
; Файлы web/web.* остаются в проекте (архитектура сохранена), но в билд
; складского режима не попадают — нет WiFi, нет OTA, нет WebServer.
[common_usb]
build_src_filter = +<*> -<.git/> -<.svn/> -<web/>
build_unflags     =

; =========================================================================
; ОКРУЖЕНИЕ 1: складской режим, прошивка/монитор через USB-COM (кабель).
; === Это основное окружение для новой задачи. ===
; У DOIT DEVKIT V1 на плате USB-UART мост (CP2102/CH340): при втыкании в
; USB плата определяется как COM-порт, а Serial пишет именно в него.
; Драйвер CP2102 устанавливается на ПК один раз.
; =========================================================================
[env:esp32_usb]
extends         = common_usb
upload_port     = COM4
monitor_port    = COM4
; Раскомментируй, чтобы запустить калибровку сразу после старта
; (как в исходном коде по команде 'c'). По умолчанию выключено.
; build_flags = -DRUN_CALIBRATION_AT_BOOT

; --- Фильтры монитора (читаемый лог/декодер исключений) -----------------
monitor_filters = esp32_exception_decoder, time, colorize

; =========================================================================
; ОКРУЖЕНИЕ 2: прошивка по воздуху (OTA). Оставлено для совместимости,
; но на складе без WiFi не применяется. Использует веб-модуль => отдельный
; фильтр сборки (включает <web/>).
; =========================================================================
[env:esp32_ota]
upload_protocol = espota
upload_port     = 192.168.199.78  ; Укажи IP адрес весов или vesy.local
upload_flags    =
  --auth=admin              ; Раскомментируй и укажи пароль, если он есть в коде
; OTA требует веб-модуль и WiFi — собираем web/* (переопределяем фильтр)
build_src_filter = +<*> -<.git/> -<.svn/>
lib_deps          =
    WiFi
    WebServer
    ESPmDNS
    ArduinoOTA
    Preferences
    GyverHX711
; В OTA-режиме нужен main.cpp со старой логикой веба; т.к. текущий main.cpp
; веб больше не зовёт, оставьте это окружение неиспользуемым до возврата WiFi.
monitor_filters = esp32_exception_decoder, time, colorize
