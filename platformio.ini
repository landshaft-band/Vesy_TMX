[platformio]
default_envs = esp32_usb

[env:esp32_usb]
platform = espressif32@7.0.1
board = esp32doit-devkit-v1
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
; Preferences is provided by the Arduino ESP32 framework.
lib_deps = GyverHX711@1.2.1
monitor_filters = esp32_exception_decoder, time, colorize
; USB only: no WiFi, WebServer, mDNS, ArduinoOTA, or OTA environment.
